<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小贝学英语">
<meta name="theme-color" content="#ffb7d5">
<meta name="color-scheme" content="light">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>小贝学英语</title>
<style>
:root{
  --pink:#ff8fb8;
  --pink-d:#f06a9a;
  --purple:#b794f6;
  --purple-d:#8b6cd4;
  --mint:#5ed0b2;
  --mint-d:#3aa88c;
  --peach:#ffb38a;
  --peach-d:#ef8d5c;
  --gold:#ffd36a;
  --cream:#fffaf7;
  --ink:#4a3550;
  --muted:#8a738f;
  --line:#f0d6e4;
  --good:#3cbf8a;
  --soft:#ffe4f0;
  --card:#fff;
  --shadow:0 10px 28px rgba(180,90,140,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;background:#ffe8f2;color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
  font-size:16px}
body{
  min-height:100dvh;
  background:linear-gradient(180deg,#ffe4f0 0%,#f3e6ff 42%,#e6fff6 100%);
  background-attachment:fixed;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  overflow-x:hidden;
  color-scheme:light;
}
button{font-family:inherit;cursor:pointer;border:0;color:inherit}
img{border:0}
.view{display:none;min-height:calc(100dvh - env(safe-area-inset-top) - env(safe-area-inset-bottom));padding:16px 18px 28px;max-width:860px;margin:0 auto}
.view.on{display:block}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:48px;margin-bottom:8px;gap:10px}
.back{background:#fff;color:var(--ink);border-radius:999px;padding:10px 16px;font-size:16px;font-weight:700;box-shadow:var(--shadow)}
.back:active{transform:scale(.96)}
h1.app{font-size:15px;color:var(--muted);font-weight:700;text-align:center;letter-spacing:.5px}

/* —— 首页 —— */
.greet{text-align:center;padding:8px 0 6px;position:relative}
.greet .hi{display:inline-block;font-size:36px;font-weight:900;line-height:1.2;padding:8px 16px;border-radius:24px;background:transparent}
.greet .hi:active{transform:scale(.97)}
.greet .appn{margin-top:2px;font-size:15px;color:var(--muted);font-weight:700}
.greet .chg{display:inline-block;margin-top:4px;background:none;border:0;color:var(--muted);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;opacity:.8}

.spark{position:absolute;right:0;top:0;width:48px;height:48px;border:0;background:none;font-size:26px;opacity:.85}
.stars-card{background:#fff;border-radius:28px;padding:16px 18px 14px;box-shadow:var(--shadow);text-align:center;margin:14px 0 18px}
.stars-card .lab{font-size:14px;color:var(--muted);font-weight:700;margin-bottom:6px}
.stars-row{font-size:28px;letter-spacing:3px;min-height:36px;line-height:1.2}
.stars-row .dim{opacity:.22;letter-spacing:3px}
.stars-card .meta{margin-top:6px;font-size:15px;color:var(--ink);font-weight:700}
.home-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mode{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;
  border-radius:28px;padding:26px 10px 22px;color:#fff;min-height:148px;
  font-size:22px;font-weight:900;box-shadow:0 8px 0 rgba(0,0,0,.12), var(--shadow);
  text-align:center;letter-spacing:.5px}
.mode:active{transform:translateY(4px);box-shadow:0 4px 0 rgba(0,0,0,.12), var(--shadow)}
.mode .ic{font-size:48px;filter:drop-shadow(0 4px 0 rgba(0,0,0,.08));line-height:1}
.mode.pink{background:linear-gradient(160deg,#ff9ec4,#ff7eab);box-shadow:0 8px 0 #e86a98, var(--shadow)}
.mode.purple{background:linear-gradient(160deg,#c9a6ff,#a784f7);box-shadow:0 8px 0 #8b6cd4, var(--shadow)}
.mode.mint{background:linear-gradient(160deg,#7ee0c6,#4ec8a8);box-shadow:0 8px 0 #3aa88c, var(--shadow)}
.mode.peach{background:linear-gradient(160deg,#ffc48a,#ff9e6a);box-shadow:0 8px 0 #ef8d5c, var(--shadow)}
.hint{text-align:center;color:var(--muted);font-size:12px;margin-top:18px;line-height:1.6}

/* —— 选名字 —— */
.pick-hero{text-align:center;padding:6px 8px 10px}
.pick-hero .emoji{font-size:42px;line-height:1}
.pick-hero h2{font-size:24px;font-weight:900;margin:4px 0 2px}
.pick-hero p{color:var(--muted);font-size:14px;font-weight:600}
.name-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.name-card{background:#fff;border-radius:20px;padding:12px 6px;font-size:22px;font-weight:900;
  box-shadow:var(--shadow);border:3px solid transparent;color:#6a3d62;text-align:center}
.name-card:active{transform:scale(.97)}
.name-card.on{border-color:#ff8fb8;background:linear-gradient(180deg,#fff,#ffe8f2);transform:scale(1.03)}
.name-confirm{width:100%;margin-top:12px;border-radius:22px;padding:14px;font-size:20px;font-weight:900;color:#fff;
  background:linear-gradient(160deg,#ff9ec4,#ff7eab);box-shadow:0 6px 0 #e86a98;display:none}
.name-confirm.show{display:block}
.name-confirm:active{transform:translateY(4px);box-shadow:0 2px 0 #e86a98}
.custom-box{margin-top:12px;background:#fff;border-radius:20px;padding:12px;box-shadow:var(--shadow)}
.custom-box label{display:block;font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px}
.custom-row{display:flex;gap:8px}
.custom-row input{flex:1;border:2px solid var(--line);border-radius:16px;padding:12px 14px;font-size:18px;font-weight:700;color:var(--ink);background:#fffafc;min-width:0}
.custom-row button{background:var(--purple);color:#fff;border-radius:16px;padding:12px 16px;font-size:16px;font-weight:800;white-space:nowrap}

/* —— 通用游戏壳 —— */
.theme-row{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 12px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.theme-row::-webkit-scrollbar{display:none}
.chip{flex:none;background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:800;box-shadow:0 4px 12px rgba(180,90,140,.1);border:2px solid transparent}
.chip.on{border-color:#ff8fb8;background:#ffe8f2}
.prog-line{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:700;color:var(--muted);margin:0 4px 10px}
.bar{height:8px;background:#fff;border-radius:999px;overflow:hidden;flex:1;margin-left:10px;box-shadow:inset 0 1px 3px rgba(0,0,0,.06)}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff8fb8,#b794f6);transition:width .25s}

/* —— 看图听词 —— */
.look-card{background:#fff;border-radius:36px;padding:22px 16px 26px;box-shadow:var(--shadow);text-align:center;min-height:380px;display:flex;flex-direction:column;align-items:center;justify-content:center;touch-action:pan-y;user-select:none}
.look-card .pic{font-size:140px;line-height:1;margin:8px 0 6px;filter:drop-shadow(0 8px 0 rgba(0,0,0,.05));transition:transform .2s}
.look-card .pic.num{font-size:120px;font-weight:900;width:160px;height:160px;border-radius:40px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#ffe8f2,#e8e0ff);color:#7a4d9c;margin:10px auto}
.look-card .en{font-size:44px;font-weight:900;letter-spacing:.5px;margin-top:6px}
.look-card .zh{font-size:20px;color:var(--muted);font-weight:700;margin-top:4px}
.look-card .letter-pair{font-size:84px;font-weight:900;letter-spacing:8px;color:#7a4d9c;line-height:1}
.look-card .say-hint{margin-top:10px;font-size:14px;color:var(--muted);font-weight:700}
.nav-row{display:flex;gap:12px;margin-top:16px;align-items:center}
.nav-row .arr{flex:none;width:72px;height:72px;border-radius:24px;background:#fff;font-size:32px;font-weight:900;box-shadow:var(--shadow)}
.nav-row .arr:active{transform:scale(.94)}
.nav-row .arr:disabled{opacity:.3}
.speak-btn{flex:1;height:72px;border-radius:24px;background:linear-gradient(160deg,#ff9ec4,#ff7eab);color:#fff;font-size:24px;font-weight:900;box-shadow:0 8px 0 #e86a98}
.speak-btn:active{transform:translateY(4px);box-shadow:0 4px 0 #e86a98}

/* —— 听音选图 —— */
.quiz-head{text-align:center;padding:6px 0 12px}
.quiz-play{display:block;margin:0 auto;width:min(100%,360px);height:88px;border-radius:28px;background:linear-gradient(160deg,#c9a6ff,#a784f7);color:#fff;font-size:28px;font-weight:900;box-shadow:0 8px 0 #8b6cd4}
.quiz-play:active{transform:translateY(4px);box-shadow:0 4px 0 #8b6cd4}
.quiz-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.opt{background:#fff;border-radius:28px;padding:18px 8px 14px;text-align:center;box-shadow:var(--shadow);border:3px solid transparent;min-height:140px}
.opt .pic{font-size:72px;line-height:1;display:block}
.opt .pic.num{font-size:56px;font-weight:900;color:#7a4d9c}
.opt .zh{display:block;margin-top:6px;font-size:14px;font-weight:800;color:var(--muted)}
.opt:active{transform:scale(.97)}
.opt.ok{border-color:var(--good);background:#eafff5;animation:pop .35s ease}
.opt.ng{border-color:#f5a3b8;animation:shake .4s ease}
@keyframes pop{0%{transform:scale(.9)}60%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
@keyframes bounceIn{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes slam{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes confetti-fall{0%{transform:translateY(-10vh) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}

/* —— 字母 —— */
.letter-choice{display:grid;gap:14px;padding-top:24px}
.choice{background:#fff;border-radius:32px;padding:28px 16px;text-align:center;box-shadow:var(--shadow);font-size:26px;font-weight:900}
.choice .ic{display:block;font-size:56px;margin-bottom:6px}
.choice.mint{background:linear-gradient(160deg,#e6fff6,#c8f5e8)}
.choice.pink{background:linear-gradient(160deg,#fff0f6,#ffe0ec)}
.letter-opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
.letter-tile{background:#fff;border-radius:28px;min-height:110px;font-size:56px;font-weight:900;color:#7a4d9c;box-shadow:var(--shadow);border:3px solid transparent}
.letter-tile:active{transform:scale(.96)}
.letter-tile.ok{border-color:var(--good);background:#eafff5}
.letter-tile.ng{border-color:#f5a3b8;animation:shake .4s ease}
.spell-pic{text-align:center;padding:8px 0 4px}
.spell-pic .pic{font-size:100px;line-height:1}
.spell-pic .zh{font-size:18px;font-weight:700;color:var(--muted);margin-top:4px}
.slots{display:flex;justify-content:center;gap:10px;margin:16px 0}
.slot{width:72px;height:80px;border-radius:20px;background:#fff;border:3px dashed #e0c0d2;display:flex;align-items:center;justify-content:center;font-size:40px;font-weight:900;color:#7a4d9c;box-shadow:var(--shadow)}
.slot.filled{border-style:solid;border-color:#ff8fb8;background:#fff5f9}
.pool{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;margin-top:10px;min-height:84px}
.pool .tile{width:72px;height:76px;border-radius:20px;background:linear-gradient(160deg,#c9a6ff,#a784f7);color:#fff;font-size:36px;font-weight:900;box-shadow:0 6px 0 #8b6cd4}
.pool .tile:active{transform:translateY(3px);box-shadow:0 3px 0 #8b6cd4}
.pool .tile.used{opacity:0;pointer-events:none}

/* —— 贴纸册 —— */
.album-head{text-align:center;padding:6px 0 14px}
.album-head h2{font-size:28px;font-weight:900}
.album-head p{color:var(--muted);font-size:15px;font-weight:700;margin-top:4px}
.album{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;background:#fff;border-radius:32px;padding:16px;box-shadow:var(--shadow);
  background-image:linear-gradient(#fff 0 0), linear-gradient(180deg,#fffafc,#fff0f6);border:6px solid #ffd0e2}
.sticker{aspect-ratio:1;border-radius:24px;background:repeating-linear-gradient(45deg,#fff 0 8px,#fff6fa 8px 16px);border:2px dashed #f0c0d4;
  display:flex;align-items:center;justify-content:center;font-size:48px;position:relative}
.sticker.has{background:linear-gradient(180deg,#fff,#ffeef6);border-style:solid;border-color:#ffc0d8;animation:pop .4s ease;box-shadow:0 4px 10px rgba(255,140,180,.2)}
.sticker .n{position:absolute;right:6px;bottom:4px;font-size:12px;font-weight:900;color:#c06088;background:#fff;border-radius:999px;padding:1px 6px}

/* —— 庆祝 —— */
#cele{position:fixed;inset:0;background:rgba(70,30,70,.28);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
#cele.on{display:flex}
.cele-box{position:relative;background:#fff;border-radius:36px;padding:32px 20px 24px;text-align:center;width:min(420px,100%);box-shadow:0 20px 50px rgba(80,20,60,.25);overflow:hidden}
.cele-emoji{font-size:88px;line-height:1;animation:bounceIn .5s cubic-bezier(.2,1.4,.4,1);filter:drop-shadow(0 8px 0 rgba(0,0,0,.06))}
.cele-msg{font-size:30px;font-weight:900;margin:12px 0 6px;animation:slam .45s ease}
.cele-sub{font-size:16px;font-weight:700;color:var(--muted)}
.cele-sticker{font-size:64px;margin:8px 0;animation:pulse .8s ease infinite}
.cele-box .go{display:block;width:100%;margin-top:16px;border-radius:22px;padding:16px;font-size:22px;font-weight:900;color:#fff;background:linear-gradient(160deg,#ff9ec4,#ff7eab);box-shadow:0 6px 0 #e86a98}
.cele-box .go:active{transform:translateY(3px);box-shadow:0 3px 0 #e86a98}
.cele-box .ghost{display:block;width:100%;margin-top:10px;border-radius:22px;padding:14px;font-size:17px;font-weight:800;background:#fff3f8;color:var(--ink)}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti i{position:absolute;top:-8px;width:12px;height:18px;border-radius:3px;animation:confetti-fall 1.6s linear forwards}

/* —— 家长 —— */
.sheet{position:fixed;inset:0;background:rgba(40,20,40,.4);z-index:70;display:none;align-items:flex-end;justify-content:center}
.sheet.on{display:flex}
.sheet .in{background:#fff;width:100%;max-width:560px;border-radius:28px 28px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));max-height:88dvh;overflow:auto}
.sheet h3{font-size:20px;font-weight:900;margin-bottom:8px}
.sheet .row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:700}
.sheet .muted{color:var(--muted);font-size:13px;line-height:1.6;margin:10px 0}
.sheet .btn{display:block;width:100%;margin-top:10px;border-radius:16px;padding:14px;font-size:16px;font-weight:800}
.sheet .danger{background:#ffe4ea;color:#c04060}
.sheet .ok{background:var(--purple);color:#fff}
.sheet .close{background:#f4eef4}

#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(50,30,50,.9);color:#fff;padding:10px 16px;border-radius:14px;font-size:15px;font-weight:700;z-index:100;display:none;max-width:90%;text-align:center}

/* iPad / 宽屏 */
@media (min-width:700px){
  .view{padding:24px 28px 40px}
  .greet .hi{font-size:48px}
  .home-grid{gap:20px;max-width:700px;margin:0 auto}
  .mode{min-height:200px;font-size:28px;border-radius:36px}
  .mode .ic{font-size:64px}
  .name-grid{grid-template-columns:repeat(4,1fr);gap:16px}
  .name-card{padding:22px 8px;font-size:26px;border-radius:24px}
  .nav-row{max-width:560px;margin-left:auto;margin-right:auto}
  .quiz-play{max-width:400px}
  .look-card{min-height:520px;padding:36px}
  .look-card .pic{font-size:200px}
  .look-card .en{font-size:60px}
  .quiz-opts{gap:18px;max-width:640px;margin:18px auto 0}
  .opt{min-height:200px}
  .opt .pic{font-size:100px}
  .letter-tile{min-height:150px;font-size:72px}
  .album{grid-template-columns:repeat(4,1fr);gap:16px;padding:22px}
  .sticker{font-size:64px}
  .stars-card{max-width:700px;margin-left:auto;margin-right:auto}
}
@media (min-width:700px) and (orientation:landscape){
  .view{max-width:1100px}
  .home-grid{grid-template-columns:repeat(4,1fr);max-width:1000px}
  .mode{min-height:180px}
  .look-wrap{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:center}
  .nav-row{flex-direction:column}
  .nav-row .arr,.speak-btn{width:100%;height:64px}
}
</style>
</head>
<body>
<div id="v-pick" class="view"></div>
<div id="v-home" class="view"></div>
<div id="v-look" class="view"></div>
<div id="v-quiz" class="view"></div>
<div id="v-letters" class="view"></div>
<div id="v-stickers" class="view"></div>
<div id="cele"></div>
<div id="parent" class="sheet"></div>
<div id="toast"></div>
<script>

  ["animals","frog","青蛙","🐸"],["animals","pig","猪","🐷"],["animals","cow","牛","🐮"],["animals","horse","马","🐴"],

  ["animals","giraffe","长颈鹿","🦒"],["animals","zebra","斑马","🦓"],["animals","fox","狐狸","🦊"],["animals","owl","猫头鹰","🦉"],

  ["colors","red","红色","🔴"],["colors","blue","蓝色","🔵"],["colors","yellow","黄色","🟡"],["colors","green","绿色","🟢"],
  ["colors","purple","紫色","🟣"],["colors","pink","粉色","💗"],["colors","brown","棕色","🤎"],["colors","black","黑色","⚫"],

function pool(theme, includeLetters){
  if(theme==="letters") return LETTERS.slice();
  var list=WORDS.slice();
  if(theme && theme!=="all") list=list.filter(function(w){ return w.theme===theme; });
  if(includeLetters && (!theme || theme==="all")) list=list.concat(LETTERS);
  return list;
}

function pickWeighted(list, n, preferIds){
  var bag=list.slice();
  var out=[];
  if(preferIds){
    preferIds.forEach(function(id){
      for(var i=0;i<bag.length;i++){ if(bag[i].id===id){ out.push(bag[i]); bag.splice(i,1); break; } }
    });
  }
  function weight(w){ return isLearned(w.id)?1:4; }
  while(out.length<n && bag.length){
    var total=0;
    for(var i=0;i<bag.length;i++) total+=weight(bag[i]);
    var r=Math.random()*total, acc=0, idx=0;
    for(i=0;i<bag.length;i++){ acc+=weight(bag[i]); if(r<=acc){ idx=i; break; } }
    out.push(bag[idx]); bag.splice(idx,1);
  }
  return out;
}
function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }

var voices=[];
function loadVoices(){
  try{ voices=(window.speechSynthesis && speechSynthesis.getVoices())||[]; }catch(e){ voices=[]; }
}
if(window.speechSynthesis){
  loadVoices();
  try{ speechSynthesis.addEventListener("voiceschanged", loadVoices); }catch(e){}
  speechSynthesis.onvoiceschanged=loadVoices;
}
function normLang(l){ return String(l||"").replace("_","-").toLowerCase(); }
function pickVoice(){
  loadVoices();
  if(!voices.length) return null;
  var lang="en-gb";
  var same=voices.filter(function(v){ return normLang(v.lang)===lang; });
  if(!same.length) same=voices.filter(function(v){ return normLang(v.lang).indexOf("en-gb")===0; });
  var pref=/Daniel|Arthur|Kate|Serena|Martha|Moira/;
  var v=same.filter(function(v){ return pref.test(v.name); })[0] || same[0];
  if(v) return v;
  var us=voices.filter(function(v){ return normLang(v.lang).indexOf("en-us")===0; });
  return us[0] || voices.filter(function(v){ return /^en/i.test(v.lang||""); })[0] || null;
}
function speak(text){
  if(!window.speechSynthesis || !text) return;
  try{
    var u=new SpeechSynthesisUtterance(String(text));
    var v=pickVoice();
    if(v){ try{ u.voice=v; }catch(e){} u.lang=v.lang||"en-GB"; }
    else { u.lang="en-GB"; }
    u.rate=VOICE_RATE;
    try{ speechSynthesis.resume(); }catch(e){}
    if(speechSynthesis.speaking || speechSynthesis.pending){
      try{ speechSynthesis.cancel(); }catch(e){}
      try{ speechSynthesis.resume(); }catch(e){}
    }
    speechSynthesis.speak(u);
    try{ speechSynthesis.resume(); }catch(e){}
  }catch(e){}
}
function speakWord(w){
  if(!w) return;
  if(w.letter) speak(w.letter);
  else speak(w.en);
}

var actx=null;
function audioCtx(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC) return null;
    if(!actx) actx=new AC();
    if(actx.state==="suspended") actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, start, dur, type, vol){
  var ctx=audioCtx(); if(!ctx) return;
  var o=ctx.createOscillator(), g=ctx.createGain();
  o.type=type||"sine"; o.frequency.value=freq;
  o.connect(g); g.connect(ctx.destination);
  var t=ctx.currentTime+start;
  g.gain.setValueAtTime(vol||0.14, t);
  g.gain.exponentialRampToValueAtTime(0.001, t+dur);
  o.start(t); o.stop(t+dur);
}

function bindSwipe(card){
  var x0=0,y0=0,lock=false;
  card.addEventListener("touchstart", function(e){ var t=e.changedTouches[0]; x0=t.clientX; y0=t.clientY; lock=false; }, {passive:true});
  card.addEventListener("touchmove", function(e){
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(!lock && Math.abs(dx)>Math.abs(dy) && Math.abs(dx)>12) lock=true;
  }, {passive:true});
  card.addEventListener("touchend", function(e){
    var t=e.changedTouches[0], dx=t.clientX-x0, dy=t.clientY-y0;
    if(Math.abs(dx)<50 || Math.abs(dx)<Math.abs(dy)) return;
    if(dx<0) lookNext();
    else if(look.i>0){ look.i--; renderLook(true); }
  });
}

/* ---------- 听音选图 ---------- */
var QUIZ_N=6;
function startQuiz(theme, opts){
  quiz.theme=theme||"all";
  quiz.i=0; quiz.locked=false; quiz.misses=0;
  var src=pool(quiz.theme, false);
  quiz.list=pickWeighted(src, Math.min(QUIZ_N, src.length), opts && opts.prefer);
  show("quiz");
  renderQuiz(true);
}
function makeOpts(correct){
  var same=WORDS.filter(function(w){ return w.theme===correct.theme && w.id!==correct.id; });
  var others=WORDS.filter(function(w){ return w.id!==correct.id && same.indexOf(w)<0; });
  var bag=shuffle(same);
  if(bag.length<3) bag=bag.concat(shuffle(others));
  var opts=shuffle([correct].concat(bag.slice(0,3)));
  return opts;
}
function renderQuiz(speakNow){
  var el=$("v-quiz");
  var w=quiz.list[quiz.i];
  if(!w){ goHome(); return; }
  quiz.opts=makeOpts(w);
  quiz.locked=false; quiz.misses=0;
  var pct=Math.round(quiz.i/Math.max(quiz.list.length,1)*100);
  el.innerHTML=topbar("home")+
    themeChips(quiz.theme, "quiz")+
    '<div class="prog-line"><span>'+(quiz.i+1)+" / "+quiz.list.length+'</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
    '<div class="quiz-head"><button type="button" class="quiz-play" id="quizSay">🔊 听一听</button></div>'+
    '<div class="quiz-opts">'+quiz.opts.map(function(o){
      return '<button type="button" class="opt" data-id="'+esc(o.id)+'">'+picHTML(o)+'<span class="zh">'+esc(o.zh)+'</span></button>';
    }).join("")+'</div>';
  bindBack(el);
  bindThemes(el, function(th){ startQuiz(th); });
  $("quizSay").onclick=function(){ speakWord(w); };
  el.querySelectorAll(".opt").forEach(function(b){
    b.onclick=function(){ onQuizPick(b, w); };
  });
  if(speakNow) speakWord(w);
}
function onQuizPick(btn, w){
  if(quiz.locked) return;
  var id=btn.getAttribute("data-id");
  if(id===w.id){
    quiz.locked=true;
    btn.classList.add("ok");
    markCorrect(w.id);
    sfxGood();
    var praise=Math.random()<0.45 && store.name;
    if(praise) speak("Great job, "+store.name+"!");
    else speakWord(w);
    var last=quiz.i>=quiz.list.length-1;
    setTimeout(function(){
      if(last) finishRound("quiz");
      else openCele({
        emoji: pickWinEmoji(),
        msg: praise ? ("Great job, "+store.name+"!") : "答对啦！",
        sub: w.en+"  ·  "+w.zh,
        ok:"下一题",
        onok:function(){ quiz.i++; renderQuiz(true); }
      });
    }, last?200:350);
  } else {
    btn.classList.add("ng");
    quiz.misses++;
    var rec=store.learned[w.id]||{streak:0, done:false};
    rec.streak=0;
    store.learned[w.id]=rec;
    save();
    sfxBad();
    speakWord(w);
    if(quiz.misses>=2){
      var right=btn.parentNode.querySelector('[data-id="'+w.id+'"]');
      if(right) right.style.boxShadow="0 0 0 4px #3cbf8a";
    }
    setTimeout(function(){ btn.classList.remove("ng"); }, 420);
  }
}
function markCorrect(id){
  var rec=store.learned[id]||{streak:0, done:false};
  rec.streak=(rec.streak||0)+1;
  if(rec.streak>=2 && !rec.done){
    rec.done=true; rec.at=today();
    if(store.today.words.indexOf(id)<0) store.today.words.push(id);
  }
  store.learned[id]=rec;
  save();
}
function pickWinEmoji(){ return ["🎉","🥳","👏","🌟","💖","😄","🦄","🌸"][Math.floor(Math.random()*8)]; }

/* ---------- 字母游戏 ---------- */
function startLettersMenu(){
  letters.mode=""; letters.i=0;
  show("letters");
  renderLettersMenu();
}
function renderLettersMenu(){
  var el=$("v-letters");
  el.innerHTML=topbar("home")+
    '<div class="pick-hero"><div class="emoji">🔤</div><h2>字母游戏</h2><p>先听字母，再试试拼单词</p></div>'+
    '<div class="letter-choice">'+
      '<button type="button" class="choice pink" id="mListen"><span class="ic">👂</span>听字母</button>'+
      '<button type="button" class="choice mint" id="mSpell"><span class="ic">🧩</span>拼单词</button>'+
    '</div>';
  bindBack(el);
  $("mListen").onclick=function(){ startListen(); };
  $("mSpell").onclick=function(){ startSpell(); };
}
function startListen(opts){
  show("letters");
  letters.mode="listen"; letters.i=0; letters.locked=false;
  var src=LETTERS.slice();
  letters.list=pickWeighted(src, 6, opts && opts.prefer);
  renderListen(true);
}
function renderListen(speakNow){
  var el=$("v-letters");
  var L=letters.list[letters.i];
  if(!L){ renderLettersMenu(); return; }
  var bag=LETTERS.filter(function(x){ return x.id!==L.id; });
  letters.opts=shuffle([L].concat(shuffle(bag).slice(0,3)));
  letters.locked=false; letters.misses=0;
  var pct=Math.round(letters.i/letters.list.length*100);
  el.innerHTML=topbar("letters-menu")+
    '<div class="prog-line"><span>'+(letters.i+1)+" / "+letters.list.length+'</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
    '<div class="quiz-head"><button type="button" class="quiz-play" id="letSay">🔊 听字母</button></div>'+
    '<div class="letter-opts">'+letters.opts.map(function(o){
      return '<button type="button" class="letter-tile" data-id="'+o.id+'">'+o.letter+'</button>';
    }).join("")+'</div>';
  bindBack(el);
  $("letSay").onclick=function(){ speak(L.letter); };
  el.querySelectorAll(".letter-tile").forEach(function(b){
    b.onclick=function(){ onListenPick(b, L); };
  });
  if(speakNow) speak(L.letter);
}
function onListenPick(btn, L){
  if(letters.locked) return;
  if(btn.getAttribute("data-id")===L.id){
    letters.locked=true;
    btn.classList.add("ok");
    sfxGood();
    var praise=Math.random()<0.45 && store.name;
    if(praise) speak("Great job, "+store.name+"!");
    else speak(L.letter);
    var last=letters.i>=letters.list.length-1;
    setTimeout(function(){
      if(last) finishRound("letters");
      else openCele({
        emoji:pickWinEmoji(),
        msg: praise ? ("Great job, "+store.name+"!") : "对啦！",
        sub: L.letter+"  "+L.letter.toLowerCase()+(L.example?"  ·  "+L.example.en:""),
        ok:"下一题",
        onok:function(){ letters.i++; renderListen(true); }
      });
    }, last?200:350);
  } else {
    btn.classList.add("ng");
    letters.misses=(letters.misses||0)+1;
    sfxBad();
    speak(L.letter);
    if(letters.misses>=2){
      var right=btn.parentNode.querySelector('[data-id="'+L.id+'"]');
      if(right) right.style.boxShadow="0 0 0 4px #3cbf8a";
    }
    setTimeout(function(){ btn.classList.remove("ng"); }, 420);
  }
}
function startSpell(opts){
  show("letters");
  letters.mode="spell"; letters.i=0;
  var src=SPELL_IDS.map(function(id){ return WORD[id]; }).filter(Boolean);
  letters.list=pickWeighted(src, 6, opts && opts.prefer);
  renderSpell();
}
function renderSpell(){
  var el=$("v-letters");
  var w=letters.list[letters.i];
  if(!w){ renderLettersMenu(); return; }
  var lettersArr=w.en.replace(/[^a-zA-Z]/g,"").toLowerCase().split("");
  var shuffled=shuffle(lettersArr);
  if(shuffled.join("")===lettersArr.join("") && lettersArr.length>1) shuffled=shuffle(lettersArr);
  letters.spell={target:lettersArr, pool:shuffled, slots:lettersArr.map(function(){ return ""; }), used:shuffled.map(function(){ return false; })};
  var pct=Math.round(letters.i/letters.list.length*100);
  el.innerHTML=topbar("letters-menu")+
    '<div class="prog-line"><span>'+(letters.i+1)+" / "+letters.list.length+'</span><div class="bar"><i style="width:'+pct+'%"></i></div></div>'+
    '<div class="spell-pic" id="spellPic">'+picHTML(w)+'<div class="zh">'+esc(w.zh)+'</div></div>'+
    '<div class="slots" id="slots"></div>'+
    '<div class="pool" id="pool"></div>'+
    '<div class="nav-row" style="margin-top:18px"><button type="button" class="speak-btn" id="spellSay">🔊 听单词</button></div>';
  bindBack(el);
  $("spellPic").onclick=function(){ speakWord(w); };
  $("spellSay").onclick=function(){ speakWord(w); };
  paintSpell();
  speakWord(w);
}
function paintSpell(){
  var sp=letters.spell;
  var slots=$("slots"), pool=$("pool");
  if(!slots||!pool) return;
  slots.innerHTML=sp.slots.map(function(ch,i){
    return '<button type="button" class="slot'+(ch?" filled":"")+'" data-i="'+i+'">'+(ch?ch.toUpperCase():"")+'</button>';
  }).join("");
  pool.innerHTML=sp.pool.map(function(ch,i){
    return '<button type="button" class="tile'+(sp.used[i]?" used":"")+'" data-i="'+i+'">'+ch.toUpperCase()+'</button>';
  }).join("");
  slots.querySelectorAll(".slot").forEach(function(b){
    b.onclick=function(){
      var i=+b.getAttribute("data-i");
      if(!sp.slots[i]) return;
      var ch=sp.slots[i];
      sp.slots[i]="";
      for(var j=0;j<sp.pool.length;j++){ if(sp.used[j] && sp.pool[j]===ch){ sp.used[j]=false; break; } }
      paintSpell();
    };
  });
  pool.querySelectorAll(".tile").forEach(function(b){
    b.onclick=function(){
      var i=+b.getAttribute("data-i");
      if(sp.used[i]) return;
      var empty=-1;
      for(var k=0;k<sp.slots.length;k++){ if(!sp.slots[k]){ empty=k; break; } }
      if(empty<0) return;
      sp.slots[empty]=sp.pool[i];
      sp.used[i]=true;
      paintSpell();
      if(sp.slots.every(Boolean)) checkSpell();
    };
  });
}
function checkSpell(){
  var sp=letters.spell, w=letters.list[letters.i];
  if(sp.slots.join("")===sp.target.join("")){
    sfxGood();
    var praise=Math.random()<0.45 && store.name;
    if(praise) speak("Great job, "+store.name+"!");
    else speakWord(w);
    var last=letters.i>=letters.list.length-1;
    setTimeout(function(){
      if(last) finishRound("letters");
      else openCele({
        emoji:pickWinEmoji(),
        msg: praise ? ("Great job, "+store.name+"!") : "拼对啦！",
        sub: w.en+"  ·  "+w.zh,
        ok:"下一题",
        onok:function(){ letters.i++; renderSpell(); }
      });
    }, last?200:350);
  } else {
    sfxBad();
    toast("再试一次吧");
    var box=$("slots");
    if(box){ box.style.animation="shake .4s ease"; setTimeout(function(){ box.style.animation=""; }, 400); }
    speakWord(w);
    setTimeout(function(){
      sp.slots=sp.target.map(function(){ return ""; });
      sp.used=sp.pool.map(function(){ return false; });
      paintSpell();
    }, 450);
  }
}

/* ---------- 贴纸与一轮结束 ---------- */
function awardSticker(src){
  var emoji=STICKER_POOL[Math.floor(Math.random()*STICKER_POOL.length)];
  store.stickers.push({id:Date.now().toString(36)+Math.random().toString(36).slice(2,5), emoji:emoji, date:today(), src:src});
  store.today.stickerCount=(store.today.stickerCount||0)+1;
  save();
  return emoji;
}
function finishRound(src){
  var st=awardSticker(src);
  sfxGood();
  var line=store.name ? ("太棒了, "+store.name+"!") : "太棒了！";
  if(store.name && Math.random()<0.6) speak("Great job, "+store.name+"!");
  openCele({
    emoji:"🎀",
    msg:line,
    sub:"这一轮完成啦，送你一张贴纸",
    sticker:st,
    ok:"再来一轮",
    alt:"回到首页",
    onok:function(){
      if(src==="look") startLook(look.theme);
      else if(src==="quiz") startQuiz(quiz.theme);
      else startLettersMenu();
    },
    onalt:function(){ goHome(); }
  });
}
function renderStickers(){
  var el=$("v-stickers");
  var list=store.stickers||[];
  var groups={};
  list.forEach(function(s){ groups[s.emoji]=(groups[s.emoji]||0)+1; });
  var keys=Object.keys(groups);
  var cells=[];
  keys.forEach(function(e){
    cells.push('<div class="sticker has">'+e+(groups[e]>1?'<span class="n">×'+groups[e]+"</span>":"")+"</div>");
  });
  var empty = (12 - (keys.length % 12)) % 12;
  if(!keys.length) empty = 12;
  for(var i=0;i<empty;i++) cells.push('<div class="sticker"></div>');
  var who=store.name?esc(store.name)+" 的贴纸册":"我的贴纸册";
  el.innerHTML=topbar("home")+
    '<div class="album-head"><h2>🎀 '+who+'</h2><p>已经收集 '+list.length+' 张贴纸</p></div>'+
    '<div class="album">'+cells.join("")+"</div>"+
    (list.length?"":'<p class="hint">玩一轮看图听词、听音选图或字母游戏，就能得到贴纸</p>');
  bindBack(el);
}

/* ---------- 庆祝弹层 ---------- */
function closeCele(){ var c=$("cele"); c.classList.remove("on"); c.innerHTML=""; document.querySelectorAll(".confetti").forEach(function(n){ n.remove(); }); }
function openCele(opt){
  var c=$("cele");
  c.classList.add("on");
  c.innerHTML='<div class="cele-box">'+
    '<div class="cele-emoji">'+(opt.emoji||"🎉")+"</div>"+
    '<div class="cele-msg">'+esc(opt.msg||"太棒了！")+"</div>"+
    (opt.sub?'<div class="cele-sub">'+esc(opt.sub)+"</div>":"")+
    (opt.sticker?'<div class="cele-sticker">'+opt.sticker+"</div>":"")+
    '<button type="button" class="go" id="celeOk">'+esc(opt.ok||"好的")+"</button>"+
    (opt.alt?'<button type="button" class="ghost" id="celeAlt">'+esc(opt.alt)+"</button>":"")+
    "</div>";
  burstConfetti();
  $("celeOk").onclick=function(){ closeCele(); if(opt.onok) opt.onok(); };
  if(opt.alt) $("celeAlt").onclick=function(){ closeCele(); if(opt.onalt) opt.onalt(); };
}
function burstConfetti(){
  document.querySelectorAll(".confetti").forEach(function(n){ n.remove(); });
  var box=document.createElement("div"); box.className="confetti";
  var colors=["#ff8fb8","#b794f6","#5ed0b2","#ffd36a","#ffb38a","#ff6b9a","#7ad7ff"];
  for(var i=0;i<36;i++){
    var p=document.createElement("i");
    p.style.left=(Math.random()*100)+"%";
    p.style.background=colors[i%colors.length];
    p.style.animationDelay=(Math.random()*0.35)+"s";
    p.style.animationDuration=(1.2+Math.random()*1.1)+"s";
    p.style.transform="rotate("+Math.random()*360+"deg)";
    p.style.width=(8+Math.random()*8)+"px";
    p.style.height=(10+Math.random()*14)+"px";
    box.appendChild(p);
  }
  document.body.appendChild(box);
  setTimeout(function(){ box.remove(); }, 2600);
}

/* ---------- 家长 ---------- */
function openParent(){
  var p=$("parent");
  p.classList.add("on");
  p.innerHTML='<div class="in">'+
    "<h3>家长看看</h3>"+
    '<div class="row"><span>英文名</span><b>'+esc(store.name||"（还没选）")+"</b></div>"+
    '<div class="row"><span>已经会的词</span><b>'+learnedCount()+" / "+WORDS.length+"</b></div>"+
    '<div class="row"><span>贴纸</span><b>'+store.stickers.length+" 张</b></div>"+
    '<div class="row"><span>今天新会的词</span><b>'+store.today.words.length+"</b></div>"+
    '<p class="muted">听音选图里连续答对 2 次，才算「会了」。长按首页右上角小星星 2 秒可以打开这里。<br>没声音请检查静音键。添加到主屏幕后，没网也能玩。</p>'+
    '<button type="button" class="btn ok" id="pName">换一个英文名</button>'+
    '<button type="button" class="btn danger" id="pReset">重置进度</button>'+
    '<button type="button" class="btn close" id="pClose">关闭</button>'+
    "</div>";
  $("pClose").onclick=function(){ p.classList.remove("on"); };
  p.onclick=function(e){ if(e.target===p) p.classList.remove("on"); };
  $("pName").onclick=function(){ p.classList.remove("on"); goPick(); };
  $("pReset").onclick=function(){
    if(!confirm("把学会的词和贴纸都清掉？名字会留下来。")) return;
    var name=store.name;
    store=defaultStore(); store.name=name; save();
    p.classList.remove("on");
    toast("进度已经清空");
    goHome();
  };
}

/* ---------- 截图 / 自测 ---------- */
function seedDemo(){
  store.name=store.name||"Lily";
  ["cat","dog","red","apple","banana","sun","mum","ball","book","fish"].forEach(function(id){
    store.learned[id]={streak:2, done:true, at:today()};
  });
  if(store.today.words.length===0) store.today.words=["cat","dog","red","apple"];
  if(!store.today.stickerCount) store.today.stickerCount=2;
  if(store.stickers.length<8){
    ["🌸","🌈","⭐","🦄","🎀","🍓","🐰","🧁","🦋","🎁"].forEach(function(e,i){
      store.stickers.push({id:"demo"+i, emoji:e, date:today(), src:"look"});
    });
  }
  save();
}
function runShot(kind){
  shotMode=kind;
  closeCele();
  $("parent").classList.remove("on");
  if(kind==="name"){ pendingName=""; show("pick"); renderPick(false); return; }
  seedDemo();
  if(kind==="home"){ goHome(); }
  else if(kind==="look"){ startLook("animals", {prefer:["cat"]}); }
  else if(kind==="quiz"){ startQuiz("animals", {prefer:["dog"]}); }
  else if(kind==="quizwin"){
    startQuiz("animals", {prefer:["cat"]});
    openCele({emoji:"🎉", msg:"Great job, "+(store.name||"Lily")+"!", sub:"cat  ·  猫", sticker:"🦄", ok:"下一题", onok:function(){}});
  }
  else if(kind==="letters"){ startSpell({prefer:["cat"]}); }
  else if(kind==="stickers"){ show("stickers"); renderStickers(); }
  else goHome();
}

/* ---------- 启动 ---------- */
function boot(){
  document.title=APP_NAME;
  store=loadStore();
  var q=new URLSearchParams(location.search);
  var shot=q.get("shot");
  if(shot){ runShot(shot); return; }
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js").then(function(){
      try{ if(navigator.serviceWorker.controller) navigator.serviceWorker.getRegistration().then(function(r){ if(r) r.update(); }); }catch(e){}
    }).catch(function(){});
    var reloaded=false;
    navigator.serviceWorker.addEventListener("controllerchange", function(){
      if(reloaded) return; reloaded=true;
      try{ if(sessionStorage.getItem("kidseng.reloaded")) return; sessionStorage.setItem("kidseng.reloaded","1"); }catch(e){}
      location.reload();
    });
  }
  if(!store.name){ show("pick"); renderPick(false); }
  else goHome();
}

window.__kidseng={
  APP_NAME:APP_NAME,
  wordCount:WORDS.length,
  letterCount:LETTERS.length,
  show:runShot,
  getStore:function(){ return store; },
  loadStore:loadStore,
  goHome:goHome
};

if(document.readyState==="loading") document.addEventListener("DOMContentLoaded", boot);
else boot();

</script>
